spring.application.name=placement-career-system
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_career_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-5.6-luna
openai.base-url=https://api.openai.com/v1

# Gemini AI Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.5-flash-lite

# Email OTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OTP configuration
app.otp.expiry-minutes=5
app.otp.max-attempts=5