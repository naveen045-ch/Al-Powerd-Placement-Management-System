services:
  mysql:
    image: mysql:8.4
    container_name: placement-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: placement_career_db
    ports:
      - "3306:3306"
    volumes:
      - placement_mysql_data:/var/lib/mysql

volumes:
  placement_mysql_data:
